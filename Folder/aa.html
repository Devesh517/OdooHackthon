<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Item</title>
  <link rel="stylesheet" href="../Folder/aa.css">
</head>
<body>

  <h2>Add New Item</h2>

  <form id="itemForm">
    <input type="text" id="name" placeholder="Item Name" required>
    
    <input type="number" id="points" placeholder="Points" required>

    <select id="category" required>
      <option value="">Select Category</option>
      <option>Men</option>
      <option>Women</option>
      <option>Kids</option>
    </select>

    <button type="submit">Submit</button>
  </form>

  <script src="../Folder/aa.css"></script>
</body>
</html>
